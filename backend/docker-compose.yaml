networks:
  chathub-network:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: chathub-db
    environment:
      POSTGRES_DB: chathub
      POSTGRES_USER: root
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d chathub"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - chathub-network

  redis:
    image: redis:7-alpine
    container_name: chathub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - chathub-network