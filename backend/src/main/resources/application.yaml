server:
  servlet:
    context-path: /api

spring:
  application:
    name: chathub

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 3000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jackson:
    default-property-inclusion: non_null

chathub:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 7d

  websocket:
    allowed-origins: ${ALLOWED_ORIGIN}