server:
  servlet:
    context-path: /api

spring:
  application:
    name: chathub

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: root
    password: pass

    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 3000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: create-drop


    properties:
      hibernate:
        jdbc:
          time_zone: UTC

    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jackson:
    default-property-inclusion: non_null

chathub:
  security:
    jwt-secret: test-jwt-secret-for-test-files-only

  websocket:
    allowed-origins: https://test.com